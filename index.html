<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E293B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حسابات الجبس">
<title>حسابات معلم الجبس — نسخة مستقلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F8FAFC;--navy:#1E293B;--gold:#D97706;--gold-soft:#FEF3C7}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:"Cairo","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:#0F172A;min-height:100dvh;overscroll-behavior-y:none}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:0}
  input,select,textarea{font-family:inherit}
  .wrap{max-width:448px;margin:0 auto;padding:0 16px}
  .topbar{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;box-shadow:0 4px 20px rgba(15,23,42,.35)}
  .topbar .row{display:flex;align-items:center;gap:12px;padding:14px 16px}
  .iconbtn{display:grid;place-items:center;width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:18px;font-weight:700;transition:transform .15s}
  .iconbtn:active{transform:scale(.94)}
  .topbar h1{margin:0;font-size:17px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar p{margin:1px 0 0;font-size:12px;font-weight:600;color:#CBD5E1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(30,41,59,.08),0 2px 8px rgba(30,41,59,.05)}
  .navy{background:var(--navy);color:#fff;border-radius:16px;box-shadow:0 14px 34px rgba(15,23,42,.28);overflow:hidden}
  .gold{background:var(--gold);color:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(217,119,6,.35);font-weight:900;transition:transform .15s}
  .gold:active{transform:scale(.98)}
  .field{width:100%;border-radius:14px;border:1.5px solid #E2E8F0;background:#fff;padding:12px 14px;font-size:15px;font-weight:600;color:#0F172A;outline:none;transition:border-color .2s,box-shadow .2s}
  .field:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,119,6,.14)}
  .label{display:block;margin-bottom:6px;font-size:13px;font-weight:800;color:#334155}
  .hint{margin-top:5px;display:block;font-size:11px;font-weight:600;color:#94A3B8}
  .stagger>*{animation:rise .45s cubic-bezier(.22,1,.36,1) both}
  .stagger>*:nth-child(2){animation-delay:.05s}
  .stagger>*:nth-child(3){animation-delay:.1s}
  .stagger>*:nth-child(4){animation-delay:.15s}
  .stagger>*:nth-child(5){animation-delay:.2s}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes sheetUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
  .sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .sheet-bg{position:absolute;inset:0;background:rgba(2,6,23,.62);backdrop-filter:blur(2px);animation:fadeIn .2s ease}
  .sheet{position:relative;width:100%;max-width:448px;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 18px 28px;animation:sheetUp .3s cubic-bezier(.22,1,.36,1)}
  .grabber{width:48px;height:6px;border-radius:99px;background:#E2E8F0;margin:0 auto 14px}
  .tile{background:rgba(255,255,255,.07);border-radius:12px;padding:12px}
  .tile p{margin:0}
  .pill{display:inline-block;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:800}
  .progress{height:10px;border-radius:99px;background:#E2E8F0;overflow:hidden}
  .progress>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F59E0B,#D97706)}
  .empty{border:2px dashed #E2E8F0;background:#fff;border-radius:16px;padding:34px 20px;text-align:center}
  .empty .ico{display:grid;place-items:center;width:60px;height:60px;border-radius:16px;background:var(--gold-soft);font-size:28px;margin:0 auto 10px}
  .bottombar{position:fixed;inset-inline:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);border-top:1px solid #E2E8F0;backdrop-filter:blur(8px)}
  .bottombar .in{max-width:448px;margin:0 auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
  .card-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(255,255,255,.05);padding:12px}
  .card-actions a,.card-actions button{border-radius:12px;padding:10px 4px;text-align:center;font-size:12px;font-weight:800;background:rgba(255,255,255,.1);color:#fff;text-decoration:none;display:block;transition:transform .15s}
  .card-actions a:active,.card-actions button:active{transform:scale(.95)}
  .wa{background:#25D366!important;color:#fff!important}
  .listitem{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:16px;box-shadow:0 6px 20px rgba(30,41,59,.06)}
  .listitem .ic{display:grid;place-items:center;width:46px;height:46px;flex:0 0 46px;border-radius:12px;font-size:20px}
  .del{display:grid;place-items:center;width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:#FEF2F2;font-size:15px}
  .thumb{width:46px;height:46px;flex:0 0 46px;border-radius:12px;object-fit:cover;border:1px solid #E2E8F0}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;border-radius:16px;padding:8px;box-shadow:0 6px 20px rgba(30,41,59,.06)}
  .tabs button{border-radius:12px;padding:12px 0;font-size:14px;font-weight:800;color:#64748B;background:transparent}
  .tabs button.on{background:var(--navy);color:#fff}
  .notice{border-radius:16px;padding:14px 16px;font-size:12px;font-weight:800;line-height:1.7}
  .notice.warn{background:#FFFBEB;color:#92400E;box-shadow:inset 0 0 0 1px #FCD34D}
  .notice.danger{background:#FEF2F2;color:#B91C1C;box-shadow:inset 0 0 0 2px #FECACA}
  .notice.ok{background:#ECFDF5;color:#047857;box-shadow:inset 0 0 0 1px #A7F3D0}
  .eq{display:block;margin-top:8px;background:rgba(255,255,255,.75);border-radius:9px;padding:7px 10px;font-size:11px;font-weight:800;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  table{width:100%;border-collapse:collapse;font-size:12px;border-radius:12px;overflow:hidden}
  th{padding:8px;text-align:right;font-weight:800}
  td{padding:8px;border-top:1px solid #F1F5F9;font-weight:700;color:#334155}
  .tot-row td{font-weight:900}
  .fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;z-index:40;border-radius:16px;padding:16px;font-size:16px;font-weight:900}
  .ph{position:fixed;inset:0;z-index:90;background:rgba(2,6,23,.9);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
  .ph img{max-width:100%;max-height:76dvh;border-radius:14px;background:#000}
  .ph button{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:12px 28px;font-weight:800}
  .imgupload{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:2px dashed #CBD5E1;background:#fff;border-radius:16px;padding:18px;font-size:14px;font-weight:800;color:#64748B}
  .imgprev{position:relative;border-radius:16px;overflow:hidden;border:2px solid #E2E8F0}
  .imgprev img{width:100%;height:150px;object-fit:cover;display:block}
  .imgprev .ov{position:absolute;inset-inline:0;bottom:0;display:flex;gap:8px;padding:10px;background:linear-gradient(to top,rgba(2,6,23,.75),transparent)}
  .imgprev .ov button{flex:1;border-radius:10px;padding:8px;font-size:12px;font-weight:800;background:rgba(255,255,255,.95);color:#0F172A}
  .imgprev .ov button.rm{background:#DC2626;color:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .stat{background:#fff;border-radius:16px;padding:14px;box-shadow:0 6px 20px rgba(30,41,59,.06)}
  .stat .k{font-size:11px;font-weight:800;color:#64748B}
  .stat .v{font-size:19px;font-weight:900;margin-top:2px}
  .linkrow{display:flex;align-items:center;justify-content:space-between;width:100%;background:#fff;border-radius:16px;padding:14px 16px;font-size:14px;font-weight:800;color:#1E293B;box-shadow:0 6px 20px rgba(30,41,59,.06);text-decoration:none}
  .divider{height:1px;background:#F1F5F9;margin:14px 0}
  .muted{color:#94A3B8;font-weight:700;font-size:11px}
  @media print{
    body{background:#fff}
    .no-print{display:none!important}
    .print-page{max-width:100%!important;padding:0!important;margin:0!important}
    .card,.navy{box-shadow:none!important}
    .print-sheet{border:1px solid #E2E8F0}
    @page{size:A4;margin:12mm}
  }
</style>

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="حسابات معلم الجبس والديكور: المشاريع والدفقات والمصروفات وكشوف الحساب — يعمل بدون إنترنت.">
</head>
<body>
<div id="app"></div>
<div id="modal-host"></div>
<script>
(function () {
  "use strict";

  /* ───────── التخزين المحلي ───────── */
  var KEY = "gypsum_standalone_v2";
  var db = load();

  function blank() {
    return { projects: [], payments: [], expenses: [] };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return blank();
      var d = JSON.parse(raw);
      return {
        projects: Array.isArray(d.projects) ? d.projects : [],
        payments: Array.isArray(d.payments) ? d.payments : [],
        expenses: Array.isArray(d.expenses) ? d.expenses : []
      };
    } catch (e) { return blank(); }
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(db));
      return true;
    } catch (e) {
      alert("مساحة التخزين ممتلئة. احذف بعض صور الفواتير القديمة أو صدّر نسخة احتياطية.");
      return false;
    }
  }
  function uid() {
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  /* ───────── مساعدات ───────── */
  function money(n) {
    n = Number(n) || 0;
    return n.toLocaleString("en-US", { maximumFractionDigits: 2 });
  }
  function shortDate(iso) {
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      return d.toLocaleDateString("ar-SA-u-nu-latn", { year: "numeric", month: "short", day: "numeric" });
    } catch (e) { return ""; }
  }
  function todayInput() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function normPhone(raw) {
    var d = String(raw || "").replace(/\D/g, "");
    if (!d) return "";
    if (d.indexOf("00") === 0) d = d.slice(2);
    if (d.indexOf("966") === 0) {
      var rest = d.slice(3);
      if (rest.charAt(0) === "0") d = "966" + rest.slice(1);
      return d;
    }
    if (d.charAt(0) === "0") return "966" + d.slice(1);
    if (d.length === 9 && d.charAt(0) === "5") return "966" + d;
    return d;
  }
  function summary(pid) {
    var p = getProject(pid);
    var pays = db.payments.filter(function (x) { return x.projectId === pid; });
    var exps = db.expenses.filter(function (x) { return x.projectId === pid; });
    var agreement = p ? Number(p.agreementTotal) || 0 : 0;
    var rec = pays.reduce(function (s, x) { return s + (Number(x.amount) || 0); }, 0);
    var spent = exps.reduce(function (s, x) { return s + (Number(x.amount) || 0); }, 0);
    var cash = rec - spent;
    return {
      agreement: agreement,
      received: rec,
      spent: spent,
      cash: cash,
      remaining: Math.max(0, agreement - rec),
      deficit: cash < 0 ? Math.abs(cash) : 0,
      progress: agreement > 0 ? Math.min(100, Math.round((rec / agreement) * 100)) : 0,
      paysCount: pays.length,
      expsCount: exps.length,
      pays: pays.slice().sort(function (a, b) { return new Date(b.paidAt) - new Date(a.paidAt); }),
      exps: exps.slice().sort(function (a, b) { return new Date(b.spentAt) - new Date(a.spentAt); })
    };
  }
  function pad4(n) { return String(n).padStart(4, "0"); }

  /** اشتقاق السندات: كل دفعة = سند قبض، كل فاتورة/أجرة = سند صرف */
  function buildVouchers(pid) {
    var pays = db.payments
      .filter(function (x) { return x.projectId === pid; })
      .sort(function (a, b) { return new Date(a.paidAt) - new Date(b.paidAt); });
    var exps = db.expenses
      .filter(function (x) { return x.projectId === pid; })
      .sort(function (a, b) { return new Date(a.spentAt) - new Date(b.spentAt); });
    var out = [];
    pays.forEach(function (x, i) {
      out.push({
        kind: "receipt", number: "ق-" + pad4(i + 1), amount: Number(x.amount) || 0,
        date: x.paidAt, party: "صاحب البيت",
        description: x.note || "دفعة مقبوضة من صاحب البيت",
        method: x.method, image: x.image, refId: x.id, category: "دفعة مقبوضة"
      });
    });
    exps.forEach(function (x, i) {
      out.push({
        kind: "payment", number: "ص-" + pad4(i + 1), amount: Number(x.amount) || 0,
        date: x.spentAt, party: x.vendor || "المورد",
        description: x.description || x.category,
        method: "cash", image: x.image, refId: x.id, category: x.category
      });
    });
    return out;
  }
  function methodText(m) {
    return m === "cash" ? "نقدي" : m === "transfer" ? "تحويل" : m === "bank" ? "شبكة / بنك" : (m || "نقدي");
  }

  function getProject(id) {
    for (var i = 0; i < db.projects.length; i++) if (db.projects[i].id === id) return db.projects[i];
    return null;
  }
  function catList() {
    return ["مواد جبس", "جبس بورد", "دهان ولوازم", "كهرباء وإنارة", "أجور عمال", "نقل ومواصلات", "عدد وأدوات", "أخرى"];
  }
  function whatsappUrl(phone, text) {
    var n = normPhone(phone);
    return n ? "https://wa.me/" + n + "?text=" + encodeURIComponent(text) : "https://wa.me/?text=" + encodeURIComponent(text);
  }
  function statementText(project, s) {
    var L = [];
    L.push("🧾 *كشف حساب مشروع ديكور وجبس*");
    L.push("━━━━━━━━━━━━━━");
    L.push("🏠 المشروع: " + project.title);
    L.push("👤 صاحب البيت: " + project.clientName);
    L.push("━━━━━━━━━━━━━━");
    L.push("💰 قيمة الاتفاقية: " + money(s.agreement) + " ر.س");
    L.push("✅ إجمالي المقبوض: " + money(s.received) + " ر.س (" + s.paysCount + " دفعات)");
    L.push("🧱 إجمالي المصروفات: " + money(s.spent) + " ر.س (" + s.expsCount + " فواتير)");
    L.push(s.cash < 0
      ? "🚨 عجز مؤقت في الكاش: " + money(Math.abs(s.cash)) + " ر.س (المصروفات أعلى من المقبوضات)"
      : "💵 الكاش المتبقي باليد: " + money(s.cash) + " ر.س");
    L.push("📌 المتبقي على صاحب البيت: " + money(s.remaining) + " ر.س");
    if (s.cash < 0) {
      L.push("━━━━━━━━━━━━━━");
      L.push("⚠️ ملاحظة: تمت تغطية فرق " + money(Math.abs(s.cash)) + " ر.س من جيب معلم الجبس كعهدة مؤقتة، ويُستقطع من الدفعة القادمة.");
    }
    L.push("━━━━━━━━━━━━━━");
    L.push("📅 " + shortDate(new Date().toISOString()));
    L.push("شكراً لتعاملكم 🤝");
    return L.join("\n");
  }
  function requestText(project, s) {
    var ask = s.remaining > 0 ? s.remaining : s.deficit;
    var L = ["السلام عليكم " + project.clientName + " 🌙", "بخصوص مشروع: " + project.title, ""];
    if (s.deficit > 0) {
      L.push("تم صرف مواد ومشتريات بقيمة تتجاوز المقبوض بمقدار " + money(s.deficit) + " ر.س،");
      L.push("وذلك لتسريع سير العمل 🙏");
    }
    if (s.remaining > 0) L.push("المتبقي من قيمة الاتفاقية: " + money(s.remaining) + " ر.س");
    if (ask > 0) L.push("نرجو تحويل دفعة بقيمة " + money(ask) + " ر.س لاستكمال المواد.");
    L.push("");
    L.push("شاكرين تعاونكم 🤝");
    return L.join("\n");
  }

  /* ───────── الحالة والعرض ───────── */
  var APP_VERSION = "1.1.0";
  var state = { screen: "home", pid: null, tab: "payments", q: "", filter: "all" };
  var app = document.getElementById("app");

  /* ───────── التحديث التلقائي ───────── */
  function askServerVersion() {
    return fetch("./index.html?ts=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var m = t.match(/APP_VERSION\s*=\s*"([^"]+)"/);
        return m ? m[1] : null;
      })
      .catch(function () { return null; });
  }

  function showUpdateBar(remote) {
    if (document.getElementById("update-bar")) return;
    var bar = document.createElement("div");
    bar.id = "update-bar";
    bar.setAttribute("dir", "rtl");
    bar.style.cssText = "position:fixed;left:10px;right:10px;bottom:14px;z-index:99999;background:#0F172A;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 14px 34px rgba(2,6,23,.5);font-family:Cairo,Tahoma,sans-serif;display:flex;align-items:center;gap:10px;border:1px solid rgba(217,119,6,.5)";
    bar.innerHTML = '<span style="font-size:19px">⬆</span>' +
      '<span style="flex:1;font-size:12px;font-weight:800;line-height:1.6">إصدار جديد متوفر (' + esc(remote) + ') — حدّث الآن لتحصل على آخر التعديلات</span>' +
      '<button id="update-now" style="background:#D97706;border:0;color:#fff;border-radius:10px;padding:9px 12px;font-family:inherit;font-size:12px;font-weight:900">تحديث</button>' +
      '<button id="update-later" style="background:transparent;border:0;color:#94A3B8;font-family:inherit;font-size:16px;font-weight:900;padding:0 4px">✕</button>';
    document.body.appendChild(bar);
    document.getElementById("update-now").onclick = hardUpdate;
    document.getElementById("update-later").onclick = function () { bar.remove(); };
  }

  function hardUpdate() {
    try {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          rs.forEach(function (r) { r.unregister(); });
        });
      }
      if ("caches" in window) {
        caches.keys().then(function (ks) {
          ks.forEach(function (k) { caches.delete(k); });
        });
      }
    } catch (e) {}
    setTimeout(function () {
      location.reload();
    }, 350);
  }

  function checkUpdate(silent) {
    return askServerVersion().then(function (remote) {
      if (!remote) {
        if (!silent) toastMsg("تعذر التحقق — تحقق من الاتصال بالإنترنت", false);
        return;
      }
      if (remote !== APP_VERSION) {
        showUpdateBar(remote);

        toastMsg("أنت على أحدث إصدار (" + APP_VERSION + ") ✓", true);

    });

  function toastMsg(text, ok) {

      (ok ? "background:#ECFDF5;color:#047857;border:1px solid #A7F3D0" : "background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA");
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }

    html += "</main>";

      "</div></div>";

    app.innerHTML = html;

      }
      html += "</div>";
      if (newRemaining < 0) {
        html += '<div class="notice danger" style="margin-top:10px">⚠️ المبلغ أكبر من المتبقي على صاحب البيت بـ ' + money(Math.abs(newRemaining)) + ' ر.س. تأكد من قيمة الاتفاقية أو الدفعات المسجلة.' +

  function compress(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 1000;
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL("image/jpeg", 0.7));
      };
      img.onerror = function () { alert("تعذر قراءة الصورة"); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

      '<label><span class="label">خصم / سلفة</span><input class="field num" id="l-ded" type="number" min="0" inputmode="decimal" placeholder="0" style="text-align:center"></label>' +
      '<label><span class="label">التاريخ</span><input class="field num" id="l-date" type="date" value="' + todayInput() + '"></label>' +
      "</div>" +
      '<div style="background:#1E293B;color:#fff;border-radius:14px;padding:14px;text-align:center">' +
      '<p style="margin:0;font-size:11px;font-weight:800;color:#CBD5E1">إجمالي الأجرة المستحقة</p>' +
      '<p class="num" id="l-total" style="margin:2px 0 0;font-size:28px;font-weight:900">0 <span style="font-size:12px">ر.س</span></p>' +
      '<p class="num" id="l-eq" style="margin:2px 0 0;font-size:11px;font-weight:700;color:#94A3B8">—</p></div>' +
      '<div id="l-alert"></div>' +
      '<label><span class="label">ملاحظة</span><input class="field" id="l-note" placeholder="مثال: تركيب جبس المجلس"></label>' +
      '<div><span class="label">📷 صورة إيصال الأجرة <span style="color:#94A3B8;font-weight:600">(اختياري)</span></span>' + imageBlock(null, "التقط صورة الإيصال") + "</div>" +
      '<input type="file" accept="image/*" capture="environment" id="file-input" style="display:none">' +
      '<div id="l-err"></div>' +
      '<button class="gold" id="l-save" style="width:100%;padding:15px;font-size:15px" data-act="save-labor">حفظ فاتورة الأجرة + سند صرف ✓</button>' +
      '<p style="margin:0;text-align:center;font-size:10.5px;font-weight:800;color:#94A3B8">يُسجَّل كمصروف «أجور عمال» ويصدر له سند صرف مرقّم</p>' +
      "</div>";

    sheet("👷 فاتورة أجرة عمال", "احسب الأجرة تلقائياً وأصدر سند صرف", body);
    tmp.pid = pid;
    tmp.image = null;
    tmp.laborImage = null;

    function calc() {
      var d = Number((document.getElementById("l-days") || {}).value) || 0;
      var r = Number((document.getElementById("l-rate") || {}).value) || 0;
      var b = Number((document.getElementById("l-bonus") || {}).value) || 0;
      var ded = Number((document.getElementById("l-ded") || {}).value) || 0;
      var total = Math.max(0, d * r + b - ded);
      var tEl = document.getElementById("l-total");
      var eqEl = document.getElementById("l-eq");
      var alertEl = document.getElementById("l-alert");
      if (tEl) tEl.innerHTML = money(total) + ' <span style="font-size:12px">ر.س</span>';
      if (eqEl) eqEl.textContent = money(d) + " × " + money(r) + (b > 0 ? " + " + money(b) : "") + (ded > 0 ? " − " + money(ded) : "");
      var after = s.cash - total;
      if (total > 0 && after < 0) {
        var deficit = Math.abs(after);
        if (alertEl) alertEl.innerHTML = '<div class="notice danger">🚨 تنبيه عجز: ' + money(deficit) + ' ر.س' +
          '<span class="eq num">العجز = المصروف بعد الأجرة − المقبوض = ' + money(s.spent + total) + " − " + money(s.received) + " = " + money(deficit) + "</span>" +
          "ستدفع الفرق من جيبك حتى تستلم الدفعة القادمة." +
          '<label style="display:flex;align-items:center;gap:8px;margin-top:8px;background:#fff;border-radius:9px;padding:8px;font-size:12px;font-weight:900;color:#B91C1C"><input type="checkbox" id="l-ack" style="width:16px;height:16px;accent-color:#DC2626"> أفهم العجز وأريد صرف الأجرة</label></div>';
        var btn = document.getElementById("l-save");
        if (btn) btn.textContent = "صرف الأجرة مع العجز ⚠️";
      } else if (total > 0) {
        if (alertEl) alertEl.innerHTML = '<div class="notice ok">✅ الكاش يكفي — سيتبقى ' + money(after) + " ر.س</div>";
        var btn2 = document.getElementById("l-save");
        if (btn2) btn2.textContent = "حفظ فاتورة الأجرة + سند صرف ✓";
      } else {
        if (alertEl) alertEl.innerHTML = "";
      }
    }
    ["l-days", "l-rate", "l-bonus", "l-ded"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener("input", calc);
    });
    calc();
  }

  /* ───────── الأحداث ───────── */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    if (el.tagName === "IMG" && el.dataset.act === "viewimg") {
      showImage(el.dataset.src);
      return;
    }
    var act = el.dataset.act;
    var id = el.dataset.id;

    if (act === "close-modal") return closeModal();
    if (act === "back") {
      if (state.screen === "statement") { state.screen = "project"; return render(); }
      state.screen = "home"; return render();
    }
    if (act === "settings") return settingsModal();
    if (act === "print") return window.print();
    if (act === "filter") { state.filter = el.dataset.v; return render(); }
    if (act === "tab") { state.tab = el.dataset.v; return render(); }
    if (act === "open") { state.pid = id; state.tab = "payments"; state.screen = "project"; return render(); }
    if (act === "statement") { state.screen = "statement"; return render(); }
    if (act === "new-project") return projectModal(null);

    if (act === "project-menu") {
      var p = getProject(state.pid);
      if (!p) return;
      var menu = document.createElement("div");
      menu.className = "sheet-wrap";
      menu.innerHTML = '<div class="sheet-bg"></div><div class="sheet" style="padding:12px">' +
        '<button class="linkrow" data-m="edit">✏️ تعديل المشروع</button>' +
        '<button class="linkrow" style="margin-top:8px" data-m="statement">🖨 كشف الحساب</button>' +
        '<button class="linkrow" style="margin-top:8px;color:#B91C1C" data-m="delete">🗑 حذف المشروع</button>' +
        '<button class="linkrow" style="margin-top:8px;justify-content:center;background:#F1F5F9;color:#475569" data-m="close">إلغاء</button></div>';
      menu.addEventListener("click", function (ev) {
        var b = ev.target.closest("[data-m]");
        if (!b) { if (ev.target.classList.contains("sheet-bg")) menu.remove(); return; }
        var m = b.dataset.m;
        menu.remove();
        if (m === "edit") return projectModal(getProject(state.pid));
        if (m === "statement") { state.screen = "statement"; return render(); }
        if (m === "delete") {
          if (confirm("حذف المشروع وكل دفعاته وفواتيره نهائياً؟")) {
            db.projects = db.projects.filter(function (x) { return x.id !== state.pid; });
            db.payments = db.payments.filter(function (x) { return x.projectId !== state.pid; });
            db.expenses = db.expenses.filter(function (x) { return x.projectId !== state.pid; });
            save(); state.screen = "home"; state.pid = null; render();
          }
          return;
        }
      });
      document.body.appendChild(menu);
      return;
    }

    if (act === "open-voucher") return openVoucher(el.dataset.ref, el.dataset.kind);
    if (act === "add-labor") return laborModal(state.pid);
    if (act === "save-labor") {
      var L = function (id) { return (document.getElementById(id) || {}).value || ""; };
      var worker = L("l-worker").trim();
      var days = Number(L("l-days")) || 0;
      var rate = Number(L("l-rate")) || 0;
      var bonus = Number(L("l-bonus")) || 0;
      var ded = Number(L("l-ded")) || 0;
      var note = L("l-note").trim();
      var dateStr = L("l-date") || todayInput();
      var total = Math.max(0, days * rate + bonus - ded);
      var errBox2 = document.getElementById("l-err");
      if (!worker) {
        errBox2.innerHTML = '<p style="margin:0;background:#FEF2F2;color:#B91C1C;border-radius:12px;padding:10px;text-align:center;font-size:13px;font-weight:800">فضلاً أدخل اسم العامل أو فريق العمل</p>';
        return;
      }
      if (total <= 0) {
        errBox2.innerHTML = '<p style="margin:0;background:#FEF2F2;color:#B91C1C;border-radius:12px;padding:10px;text-align:center;font-size:13px;font-weight:800">فضلاً أدخل عدد الأيام والأجرة اليومية</p>';
        return;
      }
      var sumL = summary(tmp.pid);
      if (total > sumL.cash) {
        var ackL = document.getElementById("l-ack");
        if (!ackL || !ackL.checked) {
          errBox2.innerHTML = '<p style="margin:0;background:#FEF2F2;color:#B91C1C;border-radius:12px;padding:10px;text-align:center;font-size:13px;font-weight:800">أجرة العمال تُحدث عجزاً — يرجى تأكيد التنبيه أولاً</p>';
          return;
        }
      }
      var parts = [days + " " + (days === 1 ? "يوم" : "أيام") + " × " + money(rate) + " ر.س"];
      if (bonus > 0) parts.push("مكافأة " + money(bonus));
      if (ded > 0) parts.push("خصم " + money(ded));
      if (note) parts.push(note);
      db.expenses.unshift({
        id: uid(), projectId: tmp.pid, amount: total,
        spentAt: new Date(dateStr + "T12:00:00").toISOString(),
        category: "أجور عمال", vendor: worker, description: parts.join(" • "),
        image: tmp.image
      });
      save(); closeModal(); render(); return;
    }

    if (act === "add-payment") return paymentModal(state.pid);
    if (act === "record-down") return paymentModal(state.pid, summary(state.pid).remaining);
    if (act === "add-expense") return expenseModal(state.pid);
    if (act === "add-quick") {
      var inp = document.getElementById("f-amount");
      if (inp) { inp.value = String((Number(inp.value) || 0) + Number(el.dataset.v)); inp.dispatchEvent(new Event("input")); }
      return;
    }
    if (act === "fill-remaining") {
      var inp2 = document.getElementById("f-amount");
      if (inp2) { inp2.value = String(summary(tmp.pid).remaining); inp2.dispatchEvent(new Event("input")); }
      return;
    }
    if (act === "full-down") {
      var down = document.getElementById("f-down");
      var total = document.getElementById("f-total");
      if (down && total) down.value = total.value || "";
      return;
    }
    if (act === "set-status") {
      tmp.status = el.dataset.v;
      var btns = el.parentNode.querySelectorAll("[data-act='set-status']");
      for (var i = 0; i < btns.length; i++) {
        var on = btns[i].dataset.v === tmp.status;
        btns[i].style.background = on ? "#FFFBEB" : "#fff";
        btns[i].style.color = on ? "#92400E" : "#64748B";
        btns[i].style.boxShadow = on ? "inset 0 0 0 2px #D97706" : "inset 0 0 0 1px #E2E8F0";
      }
      return;
    }

    if (act === "save-project" || act === "save-project-edit") {
      var title = (document.getElementById("f-title") || {}).value || "";
      var client = (document.getElementById("f-client") || {}).value || "";
      var phone = (document.getElementById("f-phone") || {}).value || "";
      var address = (document.getElementById("f-address") || {}).value || "";
      var totalVal = Number((document.getElementById("f-total") || {}).value) || 0;
      var notes = (document.getElementById("f-notes") || {}).value || "";
      var errBox = document.getElementById("form-err");
      if (!title.trim() || !client.trim()) { errBox.innerHTML = '<p style="margin:0;background:#FEF2F2;color:#B91C1C;border-radius:12px;padding:10px;text-align:center;font-size:13px;font-weight:800">فضلاً أدخل اسم المشروع واسم صاحب البيت</p>'; return; }
      if (totalVal <= 0) { errBox.innerHTML = '<p style="margin:0;background:#FEF2F2;color:#B91C1C;border-radius:12px;padding:10px;text-align:center;font-size:13px;font-weight:800">فضلاً أدخل قيمة الاتفاقية (أكبر من صفر)</p>'; return; }

      if (act === "save-project-edit") {
        var pr = getProject(tmp.editingId);
        if (pr) {
          pr.title = title.trim(); pr.clientName = client.trim(); pr.phone = phone.trim();
          pr.address = address.trim(); pr.agreementTotal = totalVal; pr.notes = notes.trim();
          pr.status = tmp.status || pr.status;
        }
        save(); closeModal(); render(); return;
      }

      var pid = uid();
      db.projects.unshift({
        id: pid, title: title.trim(), clientName: client.trim(), phone: phone.trim(),
        address: address.trim(), agreementTotal: totalVal, notes: notes.trim(),
        status: "active", createdAt: new Date().toISOString()
      });
      var downVal = Number((document.getElementById("f-down") || {}).value) || 0;
      if (downVal > 0) {
        db.payments.unshift({
          id: uid(), projectId: pid, amount: downVal, paidAt: new Date().toISOString(),
          method: "cash", note: "دفعة مقدمة عند الاتفاق", image: null
        });
      }
      save(); closeModal();
      state.pid = pid; state.screen = "project"; state.tab = "payments"; render(); return;
    }

    if (act === "save-payment") {
      var amount = Number((document.getElementById("f-amount") || {}).value) || 0;
      var dateV = (document.getElementById("f-date") || {}).value || todayInput();
      var method = (document.getElementById("f-method") || {}).value || "cash";
      var note = (document.getElementById("f-note") || {}).value || "";
      var err = document.getElementById("form-err");
      if (amount <= 0) { err.innerHTML = '<p style="margin:0;background:#FEF2F2;color:#B91C1C;border-radius:12px;padding:10px;text-align:center;font-size:13px;font-weight:800">فضلاً أدخل مبلغ الدفعة</p>'; return; }
      var sum = summary(tmp.pid);
      if (amount > sum.remaining && sum.remaining >= 0) {
        var ack = document.getElementById("ack-over");
        if (!ack || !ack.checked) {
          err.innerHTML = '<p style="margin:0;background:#FEF2F2;color:#B91C1C;border-radius:12px;padding:10px;text-align:center;font-size:13px;font-weight:800">المبلغ أكبر من المتبقي على صاحب البيت — يرجى تأكيد التنبيه أولاً</p>';
          return;
        }
      }
      db.payments.unshift({
        id: uid(), projectId: tmp.pid, amount: amount,
        paidAt: new Date(dateV + "T12:00:00").toISOString(),
        method: method, note: note.trim(), image: tmp.image
      });
      save(); closeModal(); render(); return;
    }

    if (act === "save-expense") {
      var amt = Number((document.getElementById("f-amount") || {}).value) || 0;
      var dV = (document.getElementById("f-date") || {}).value || todayInput();
      var cat = (document.getElementById("f-category") || {}).value || "أخرى";
      var vendor = (document.getElementById("f-vendor") || {}).value || "";
      var desc = (document.getElementById("f-desc") || {}).value || "";
      var err2 = document.getElementById("form-err");
      if (amt <= 0) { err2.innerHTML = '<p style="margin:0;background:#FEF2F2;color:#B91C1C;border-radius:12px;padding:10px;text-align:center;font-size:13px;font-weight:800">فضلاً أدخل قيمة الفاتورة</p>'; return; }
      var s2 = summary(tmp.pid);
      if (amt > s2.cash) {
        var ack2 = document.getElementById("ack-exp");
        if (!ack2 || !ack2.checked) {
          err2.innerHTML = '<p style="margin:0;background:#FEF2F2;color:#B91C1C;border-radius:12px;padding:10px;text-align:center;font-size:13px;font-weight:800">هذه الفاتورة تُحدث عجزاً — يرجى تأكيد التنبيه أولاً</p>';
          return;
        }
      }
      db.expenses.unshift({
        id: uid(), projectId: tmp.pid, amount: amt,
        spentAt: new Date(dV + "T12:00:00").toISOString(),
        category: cat, vendor: vendor.trim(), description: desc.trim(), image: tmp.image
      });
      save(); closeModal(); render(); return;
    }

    if (act === "del-pay") {
      if (confirm("حذف هذه الدفعة نهائياً؟")) {
        db.payments = db.payments.filter(function (x) { return x.id !== id; });
        save(); render();
      }
      return;
    }
    if (act === "del-exp") {
      if (confirm("حذف هذه الفاتورة نهائياً؟")) {
        db.expenses = db.expenses.filter(function (x) { return x.id !== id; });
        save(); render();
      }
      return;
    }

    if (act === "pick-image") {
      var fi2 = document.getElementById("file-input");
      if (fi2) fi2.click();
      return;
    }
    if (act === "remove-image") {
      tmp.image = null;
      var holder2 = document.querySelector(".imgprev");
      if (holder2) {
        var w2 = document.createElement("div");
        w2.innerHTML = imageBlock(null, "التقط الصورة");
        holder2.replaceWith(w2.firstChild);
      }
      return;
    }

    if (act === "check-update") {
      var vb = document.getElementById("ver-box");
      if (vb) vb.textContent = "جارٍ التحقق…";
      askServerVersion().then(function (remote) {
        var box = document.getElementById("ver-box");
        if (!remote) {
          if (box) box.textContent = "تعذر التحقق — تأكد من الاتصال";
          return;
        }
        if (remote !== APP_VERSION) {
          if (box) box.textContent = "إصدار جديد: " + remote;
          showUpdateBar(remote);
        } else if (box) {
          box.textContent = "أنت على أحدث إصدار " + APP_VERSION + " ✓";
        }
      });
      return;
    }
    if (act === "force-update") return hardUpdate();

    if (act === "export") {
      var payload = JSON.stringify({ app: "gypsum-accounting", version: 1, exportedAt: new Date().toISOString(), data: db }, null, 2);
      var blob = new Blob([payload], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var d = new Date();
      a.href = url;
      a.download = "نسخة-احتياطية-حسابات-الجبس-" + d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      var m = document.getElementById("set-msg");
      if (m) m.innerHTML = '<div class="notice ok">تم تنزيل النسخة الاحتياطية ✅</div>';
      return;
    }
    if (act === "import") {
      var ii = document.getElementById("import-input");
      if (ii) ii.click();
      return;
    }
    if (act === "clear") {
      if (confirm("حذف كل المشاريع والدفعات والفواتير من هذا الجوال؟ لا يمكن التراجع.")) {
        db = blank(); save(); closeModal(); state.screen = "home"; state.pid = null; render();
      }
      return;
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "import-input") {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var parsed = JSON.parse(r.result);
          var d = parsed && parsed.data ? parsed.data : parsed;
          var ps = Array.isArray(d.projects) ? d.projects : [];
          var pys = Array.isArray(d.payments) ? d.payments : [];
          var exs = Array.isArray(d.expenses) ? d.expenses : [];
          if (!ps.length && !pys.length && !exs.length) throw new Error("empty");
          var have = {};
          db.projects.forEach(function (x) { have[x.id] = 1; });
          ps.forEach(function (x) { if (!have[x.id]) { db.projects.push(x); have[x.id] = 1; } });
          var haveP = {};
          db.payments.forEach(function (x) { haveP[x.id] = 1; });
          pys.forEach(function (x) { if (!haveP[x.id]) db.payments.push(x); });
          var haveE = {};
          db.expenses.forEach(function (x) { haveE[x.id] = 1; });
          exs.forEach(function (x) { if (!haveE[x.id]) db.expenses.push(x); });
          if (save()) {
            alert("تم الاستيراد: " + ps.length + " مشروع، " + pys.length + " دفعة، " + exs.length + " فاتورة");
            closeModal(); render();
          }
        } catch (err) {
          alert("الملف غير صالح — تأكد أنه ملف نسخة احتياطية");
        }
      };
      r.readAsText(f);
      e.target.value = "";
    }
    if (e.target && e.target.id === "file-input") {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      compress(file, function (dataUrl) {
        tmp.image = dataUrl;
        var holder3 = document.querySelector(".imgupload, .imgprev");
        if (holder3) {
          var w3 = document.createElement("div");
          w3.innerHTML = imageBlock(dataUrl, "");
          holder3.replaceWith(w3.firstChild);
        }
      });
      e.target.value = "";
    }
  });

  render();
})();
</script>
<script>
/* ─── PWA: تفعيل العمل بدون إنترنت ─── */
(function () {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function (reg) {
        reg.addEventListener('updatefound', function () {});
      }).catch(function () {});
    });
  }
  // رسالة صغيرة عند أول زيارة لتوضيح التثبيت
  try {
    var KEY = 'gypsum_install_hint_v1';
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(function () {
        if (window.matchMedia('(display-mode: standalone)').matches) return;
        var bar = document.createElement('div');
        bar.setAttribute('dir', 'rtl');
        bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:16px;z-index:9999;background:#1E293B;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 12px 30px rgba(15,23,42,.4);font-family:Cairo,Tahoma,sans-serif;font-size:12px;font-weight:800;display:flex;align-items:center;gap:10px';
        bar.innerHTML = '<span style="font-size:18px">📲</span><span style="flex:1;line-height:1.6">ثبّت التطبيق على شاشتك الرئيسية: قائمة المتصفح ⋮ ← «تثبيت التطبيق»</span><button style="background:#D97706;border:0;color:#fff;border-radius:10px;padding:7px 10px;font-family:inherit;font-weight:900;font-size:11px">حسناً</button>';
        bar.querySelector('button').onclick = function () { bar.remove(); };
        document.body.appendChild(bar);
      }, 1800);
    }
  } catch (e) {}
})();
</script>
